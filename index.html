<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F2033">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HandPulse">
<meta name="color-scheme" content="light dark">
<title>HandPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#15202C; --muted:#5B6878; --floor:#E8EDF2; --panel:#FFFFFF; --line:#CED7E2;
  --navy:#1F3A5F; --brick:#8E2F2B;
  --board:#16263A; --board-ink:#E8EEF5; --board-soft:#AFC0D3; --amber:#FFC24A;
  --court:#D3DFEB; --area:#B9CCE0; --courtline:#1F3A5F; --zone:#F5F8FB; --zone-ink:#1F3A5F;
  --goal:#2E8B57; --miss:#B54D48; --prov:#6A4C9C; --lost:#C26A1F; --won:#2F6DB5;
  --yellow:#E3B505; --twomin:#D3562A; --red:#A8261F;
  --sel:#1F3A5F; --sel-r:#8E2F2B;
  --gk-bg:#FFF1C9; --gk-line:#E2B13C; --gk-ink:#7A5600; --riv-bg:#FBEDEB; --riv-line:#E0B0AA; --riv-ink:#8E2F2B; --us-ink:#1F3A5F;
  --font:"Barlow","Segoe UI",Roboto,system-ui,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E6ECF3; --muted:#9AABBE; --floor:#0E1721; --panel:#162232; --line:#2B3C51;
    --board:#0A121C; --court:#1B2B3D; --area:#26405C; --courtline:#9DB8D8; --zone:#21344A; --zone-ink:#DCE6F2;
    --sel:#4675AE;
    --gk-bg:#3B3215; --gk-line:#8F7426; --gk-ink:#F2CF6B; --riv-bg:#3A2224; --riv-line:#7A3B37; --riv-ink:#F2A49E; --us-ink:#9DB8D8;
  }
}
:root[data-theme="dark"]{
  --ink:#E6ECF3; --muted:#9AABBE; --floor:#0E1721; --panel:#162232; --line:#2B3C51;
  --board:#0A121C; --court:#1B2B3D; --area:#26405C; --courtline:#9DB8D8; --zone:#21344A; --zone-ink:#DCE6F2;
  --sel:#4675AE;
  --gk-bg:#3B3215; --gk-line:#8F7426; --gk-ink:#F2CF6B; --riv-bg:#3A2224; --riv-line:#7A3B37; --riv-ink:#F2A49E; --us-ink:#9DB8D8;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;background:var(--floor);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:default}
button:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
#app{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto auto;height:100%}

/* marcador del pavelló */
.board{background:var(--board);color:var(--board-ink);display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:8px 12px}
.match{font-family:var(--cond);font-size:21px;font-weight:600;padding:6px 10px;border-radius:6px;background:rgba(255,255,255,.07);text-align:left;max-width:300px}
.match small{display:block;font-family:var(--font);font-size:11.5px;font-weight:400;color:var(--board-soft)}
.match small{font-family:var(--cond);font-size:17px;font-weight:600;color:#DCE6F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clockwrap{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;justify-content:center}
.part{font-family:var(--cond);font-size:18px;font-weight:600;padding:9px 10px;border-radius:6px;background:rgba(255,255,255,.09)}
.clock{font-family:var(--cond);font-weight:700;font-size:50px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;min-width:3.3ch;text-align:center;text-shadow:0 0 18px rgba(255,194,74,.28)}
.clock.stopped{opacity:.5;text-shadow:none}
.play{width:58px;height:58px;border-radius:50%;background:var(--amber);color:#3A2A00;font-size:22px;font-weight:700}
.play.on{background:#E3EAF2;color:var(--board)}
.adj{display:grid;grid-template-columns:auto auto;gap:4px}
.adj button{font-family:var(--cond);font-size:15px;padding:5px 9px;border-radius:5px;background:rgba(255,255,255,.1)}
.endpart{font-family:var(--cond);font-size:17px;padding:9px 11px;border-radius:6px;border:1px solid rgba(255,255,255,.28)}
.score{font-family:var(--cond);font-weight:700;font-size:62px;line-height:1;display:flex;gap:10px;align-items:baseline;margin-left:10px}
.score .them{color:#F4A8A2}
.score .sep{color:#6F8297;font-size:30px}
.tools{display:flex;gap:6px;align-items:center}
.tools button{font-family:var(--cond);font-size:18px;padding:11px 13px;border-radius:6px;background:rgba(255,255,255,.1)}
.tools .primary{background:var(--amber);color:#3A2A00;font-weight:600}
.sync{flex-basis:100%;font-size:11.5px;color:var(--board-soft);text-align:right;pointer-events:none}

/* tres passos */
main{display:grid;grid-template-columns:minmax(250px,330px) minmax(0,1fr) minmax(250px,330px);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"qui que riv" "qui on riv";gap:10px;padding:10px;min-height:0}
#qui{grid-area:qui}#que{grid-area:que}#on{grid-area:on}#riv{grid-area:riv}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:block;min-height:0;overflow:auto}
.panel.now{border-color:var(--sel);box-shadow:inset 0 0 0 2px var(--sel)}
.step{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:var(--cond);font-size:20px;font-weight:600;color:var(--muted)}
.step b{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:50%;border:2px solid currentColor;font-size:15px}
.panel.now .step{color:var(--ink)}
.panel.now .step b{background:var(--sel);border-color:var(--sel);color:#fff}
.hint{font-size:13.5px;color:var(--muted);margin:0 0 8px;line-height:1.35}

.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.pl{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:62px;border-radius:8px;background:var(--zone);border:1px solid var(--line);padding:4px 2px;min-width:0}
.pl .n{font-family:var(--cond);font-size:27px;font-weight:700;line-height:1}
.pl .nm{font-size:11.5px;color:var(--muted);max-width:100%;overflow:hidden;line-height:1.12;max-height:2.3em;white-space:normal;overflow-wrap:anywhere;text-align:center}
.pl.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.pl.sel .nm{color:#DCE6F2}
.pl.gk{background:var(--gk-bg);border-color:var(--gk-line)}
.pl.gk .n{color:var(--gk-ink)}
.pl.riv{background:var(--riv-bg);border-color:var(--riv-line)}
.pl.riv .n{color:var(--riv-ink)}
.pl.gk.sel{background:var(--sel);border-color:var(--sel)}
.pl.riv.sel{background:var(--sel-r);border-color:var(--sel-r);color:#fff}
.pl.gk.sel .n,.pl.riv.sel .n{color:#fff}
.pl.riv.sel .nm{color:#F6D9D6}
.pl.riv.gk{background:var(--gk-bg);border-color:var(--gk-line)}
.pl.riv.gk .n{color:var(--gk-ink)}
.pl.riv.gk.sel{background:var(--sel-r);border-color:var(--sel-r)}
.pl.riv.gk.sel .n{color:#fff}
.rivrow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.rivrow button{min-height:52px;border-radius:8px;border:1px solid var(--line);background:var(--zone);font-family:var(--cond);font-size:18px;font-weight:600}
.gkbar{display:flex;align-items:center;gap:10px;width:100%;min-height:54px;margin:0 0 10px;padding:6px 12px;border-radius:8px;background:var(--gk-bg);border:1px solid var(--gk-line);color:var(--gk-ink);text-align:left}
.gkbar .lbl{font-size:13px;font-weight:600}
.gkbar .who{font-family:var(--cond);font-size:23px;font-weight:700;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gkbar .chg{font-family:var(--cond);font-size:17px;font-weight:600;padding:5px 10px;border-radius:6px;border:1px solid var(--gk-line)}
.pl{position:relative}
.sanc{position:absolute;top:3px;right:3px;display:flex;gap:2px;align-items:center;pointer-events:none}
.sanc .yc,.sanc .rc{width:9px;height:13px;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.sanc .yc{background:#F5C400}
.sanc .rc{background:#D7261E}
.sanc .x{font-family:var(--cond);font-size:13px;font-weight:700;line-height:1;color:#D7261E}
.sanc .x.live{background:#D7261E;color:#fff;border-radius:4px;padding:1px 4px}
.pl.sel .sanc .x{color:#FFB3AE}
.pl.sel .sanc .x.live{color:#fff}
.pl.out,.pl.out.gk,.pl.out.riv{background:#3F444C;border-color:#3F444C;color:#D9DEE5}
.pl.out .n,.pl.out .nm,.pl.out.gk .n,.pl.out.riv .n{color:#D9DEE5}
.pl.out.sel{background:var(--sel);border-color:var(--sel)}
.pl.blink{animation:blinkpl .6s steps(1,end) infinite}
@keyframes blinkpl{0%{box-shadow:inset 0 0 0 4px #D7261E}50%{box-shadow:none}}
.gkbar.riv{background:var(--riv-bg);border-color:var(--riv-line);color:var(--riv-ink)}
.gkbar.riv .chg{border-color:var(--riv-line)}
.gkbar.small{min-height:44px;margin:10px 0 0}
.gkbar.small .who{font-size:19px}
#riv.now{border-color:var(--brick);box-shadow:inset 0 0 0 2px var(--brick)}
#riv.now .step b{background:var(--brick);border-color:var(--brick);color:#fff}
button.rival{margin-top:8px;min-height:58px;border-radius:8px;background:var(--brick);color:#fff;font-family:var(--cond);font-size:23px;font-weight:600}
button.rival.sel{box-shadow:inset 0 0 0 4px var(--amber)}
.backs{display:flex;gap:8px;margin-top:10px}
.backs .back{flex:1 1 0;margin:0;min-height:52px}
.court.rival{outline:3px solid var(--brick);outline-offset:-3px;border-radius:6px}
.padshow{font-family:var(--cond);font-size:40px;font-weight:700;text-align:center;color:var(--brick);margin:0 0 8px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{min-height:56px;border-radius:8px;background:var(--zone);border:1px solid var(--line);font-family:var(--cond);font-size:27px;font-weight:600}
.pad .z0{grid-column:span 2}
.pad .clr{font-size:18px}
.back{margin-top:8px;min-height:50px;border-radius:8px;background:var(--navy);color:#fff;font-family:var(--cond);font-size:19px}

.grp{margin-bottom:7px}
.grp h3{margin:0 0 3px;font-size:11.5px;font-weight:600;color:var(--muted)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ac{min-height:46px;border-radius:8px;color:#fff;font-family:var(--cond);font-size:19px;font-weight:600;padding:4px;line-height:1.05}
.ac.goal{background:var(--goal);grid-column:1/-1;min-height:54px;font-size:24px}
.ac.miss{background:var(--miss)} .ac.prov{background:var(--prov)} .ac.lost{background:var(--lost)}
.ac.won{background:var(--won)} .ac.yellow{background:var(--yellow);color:#2B2300}
.ac.twomin{background:var(--twomin)} .ac.red{background:var(--red)}
.ac.sel{box-shadow:inset 0 0 0 4px var(--ink)}
.ac:disabled{opacity:.4}

.court{width:100%;height:auto;display:block;max-height:46vh;max-height:calc(100vh - 415px);max-height:calc(100dvh - 415px);min-height:170px}
.allacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:5px}
.allacts .ac{min-height:42px;font-size:16px}
.allacts .ac.goal{min-height:42px;font-size:20px}
.court .z{cursor:pointer}
.court .z path{fill:var(--zone);stroke:var(--court);stroke-width:4}
.court .z text{font-family:var(--cond);font-size:19px;font-weight:600;fill:var(--zone-ink);pointer-events:none}
.court .z.sel path{fill:var(--sel)}
.court.rival .z.sel path{fill:var(--sel-r)}
.court .z.sel text{fill:#fff}
.court.idle .z{opacity:.6}
.court .deco{pointer-events:none}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.extra button,.wide{min-height:54px;border-radius:8px;background:var(--zone);border:1px solid var(--line);font-family:var(--cond);font-size:20px;font-weight:600}
.extra button.sel{background:var(--sel);border-color:var(--sel);color:#fff}
.wide{width:100%}
.wide.strong{background:var(--navy);border-color:var(--navy);color:#fff}
.goalgrid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);aspect-ratio:3/2;width:100%;max-width:540px;max-width:min(540px,calc((100vh - 425px) * 1.5));max-width:min(540px,calc((100dvh - 425px) * 1.5));min-width:240px;margin:2px auto 10px;border:9px solid var(--ink);border-bottom:3px solid var(--ink);background:var(--line);gap:2px}
.goalgrid button{background:var(--zone);font-family:var(--cond);font-size:30px;font-weight:700;color:var(--muted)}
.tipus{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tipus button{min-height:54px;border-radius:8px;background:var(--zone);border:1px solid var(--line);font-size:16px;font-weight:600;text-align:left;padding:6px 10px}
.tipus button b{font-family:var(--cond);font-size:21px;margin-right:8px;color:var(--lost)}

footer{display:flex;flex-wrap:nowrap;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel);min-height:72px;max-height:86px;overflow:hidden}
.pending{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;flex:0 1 auto;min-width:0;max-width:55%;overflow:hidden}
.chip{font-family:var(--cond);font-size:21px;padding:5px 10px;border-radius:999px;background:var(--zone);border:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:240px;flex:0 1 auto}
.chip.r{border-color:var(--brick);color:var(--brick)}
.cancel{font-family:var(--cond);font-size:18px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);white-space:nowrap}
.hist{display:flex;gap:6px;overflow-x:auto;flex:1 1 auto;min-width:0}
.h{display:flex;align-items:center;gap:4px;font-family:var(--cond);font-size:20px;padding:3px 3px 3px 10px;border-radius:8px;background:var(--zone);border:1px solid var(--line);white-space:nowrap}
.h.r{background:transparent;border-style:dashed;border-color:var(--brick)}
.h .x{width:34px;height:34px;border-radius:6px;font-size:20px;color:var(--muted)}
.h.new{animation:pop .7s ease-out}
@keyframes pop{from{background:var(--amber)}}
@media (prefers-reduced-motion:reduce){.h.new{animation:none}}
.undo{font-family:var(--cond);font-size:18px;padding:11px 13px;border-radius:8px;background:var(--navy);color:#fff;white-space:nowrap}

.ov{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(10,18,28,.55);display:grid;place-items:center;padding:16px;z-index:18}
.fastb{margin-left:auto;font-family:var(--cond);font-size:15px;font-weight:600;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.note.due{color:var(--brick);font-weight:600}
.rt tr.me td{background:rgba(242,183,5,.18);font-weight:700}
.stt td,.stt th{padding:6px 7px}
.stt td.l{white-space:normal;min-width:120px}
@media (max-width:480px){.stt .cgol{display:none}.stt td,.stt th{padding:6px 5px;font-size:14px}}
.rrh{font-family:var(--cond);font-size:20px;margin:14px 0 6px}
.rres{display:grid;gap:6px;margin:0 0 10px}
.rr{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.rr span:first-child{text-align:right}
.rr b{font-family:var(--cond);font-size:19px;min-width:58px;text-align:center}
.rr.me{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.repcard label{display:block;font-weight:600;margin:12px 0 4px}
.repcard textarea{display:block;width:100%;box-sizing:border-box;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--zone);color:var(--ink);font:inherit;font-size:16px}
.repcard .row{margin-top:8px}
.tmb{margin-left:auto;font-family:var(--cond);font-size:15px;font-weight:600;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);background:var(--zone);line-height:1.2;flex:none}
.tmb.riv{color:var(--riv-ink);border-color:var(--riv-ink)}
.tmb.tmfull{opacity:.45}
.step .tmb + .tmb{margin-left:6px}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:4px 0 8px}
.sq{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--zone);color:var(--muted);font-size:15px;min-height:42px;opacity:.55}
.sq b{font-family:var(--cond);font-size:18px;margin-right:4px;color:var(--ink)}
.sq.on{opacity:1;color:var(--ink);border-color:var(--navy);box-shadow:inset 0 0 0 2px var(--navy)}
.sq.gk.on{border-color:var(--amber);box-shadow:inset 0 0 0 2px var(--amber)}
.ofw{display:block;font-size:11px;font-weight:700;color:var(--brick);white-space:nowrap}
.langs.wl{margin:0 0 12px}
.langs.wl button{color:var(--ink);border-color:var(--line);font-family:inherit;font-size:14px}
#att .tabs{position:sticky;top:0;z-index:2}
.mitem.att{grid-template-columns:54px minmax(0,1fr) auto auto}.acount span{font-style:normal;font-family:var(--cond);font-weight:700;font-size:14px;padding:2px 7px;border-radius:999px;color:#fff}
.acount{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.acount span{font-size:15px;padding:4px 10px}
.sP{background:var(--goal)}.sR{background:#B07A00}.sF{background:var(--red)}.sJ{background:var(--won)}.sL{background:var(--prov)}

#att .hbody input,#att .hbody select{width:100%;font:inherit;font-size:16px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--zone);color:var(--ink)}
#att .hbody label{display:block;font-size:13.5px;font-weight:600;color:var(--muted);margin:10px 0 4px}
#att .row{display:flex;flex-wrap:wrap;gap:8px}
.rrows{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.rrow{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,150px) 44px;gap:6px;align-items:center}
.sheet .rrow input,.sheet .rrow select{padding:8px;font-size:16px}
.rrow .rx{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--zone);font-size:22px;color:var(--brick)}
.radd{margin:2px 0 10px}
.paste{margin:6px 0 4px}
.paste summary{cursor:pointer;font-weight:600;color:var(--navy);padding:6px 0}
.sheet .paste textarea{min-height:120px}
.sheet textarea.fbt{min-height:70px}
.pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px}
.pkpis div{background:var(--zone);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.pkpis span{display:block;font-size:13px;color:var(--muted)}
.pkpis b{font-family:var(--cond);font-size:30px;line-height:1.1}
.pkpis.small b{font-size:22px}
.repcard h3 small{font-size:15px;color:var(--muted);font-weight:600}
.homeb{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;background:rgba(255,255,255,.12);color:var(--board-ink);flex:none}
.full{position:fixed;top:0;right:0;bottom:0;left:0;z-index:12;background:var(--floor);overflow:auto;-webkit-overflow-scrolling:touch}
.hhead{background:var(--board);color:var(--board-ink);padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}

/* mai més ample que la pantalla: el cos tècnic cap sempre en una fila, amb els noms escurçats si cal */
.staffbar:not(.pick) button{flex:1 1 0;min-width:0}
.staffbar:not(.pick) button span{min-width:0;overflow:hidden}
.staffbar:not(.pick) button span,.staffbar:not(.pick) button small{white-space:nowrap;text-overflow:ellipsis;overflow:hidden}

/* idiomes amb banderes */
.langs .flag{display:block;flex:none;width:26px;height:18px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.28)}
.langs .flag svg{display:block;width:100%;height:100%}
.langs button.fl{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:5px 7px;min-width:0;line-height:1;cursor:pointer}
.langs button.fl:not(.on) .flag{opacity:.6}
.langs button.fl.on{background:transparent;border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.langs.wl button.fl{padding:7px 12px}
.langs.wl button.fl.on{font-weight:700}

/* fotos dels jugadors del rival (de la federació) */
.rvros .rvp{font:inherit;cursor:pointer;color:inherit;background:var(--floor);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.rvros .rvp:hover{border-color:var(--ink)}
.phbox{text-align:center}
.phbox h2{margin:10px 0 2px}
.phbig,.phi{position:relative;display:inline-block;overflow:hidden;background:var(--floor);border:1px solid var(--line)}
.phbig{width:220px;height:220px;max-width:70vw;max-height:70vw;border-radius:14px}
.phin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:700;color:var(--muted)}
.phbig .phin{font-size:64px}
.phbig img,.phi img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.phc{text-align:center;font-size:12px;line-height:1.25}
.phc b{display:block;margin-top:4px}
.phc small{color:var(--muted)}
.phi{width:100%;aspect-ratio:1;border-radius:8px}
.phi .phin{font-size:22px}
@media print{.pbreak{break-before:page}.phg{grid-template-columns:repeat(8,minmax(0,1fr));gap:3mm}.phc{font-size:8pt}.phi .phin{font-size:14pt}}

/* jugador exclòs (2 minuts): apagat mentre dura l'exclusió */
.pl.susp{opacity:.5;filter:grayscale(.6)}
.pl.susp.blink{opacity:1;filter:none}

/* samarretes amb els colors de l'equipació (federació) */
:root{--shirt-line:rgba(0,0,0,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--shirt-line:rgba(255,255,255,.7)}}
:root[data-theme="dark"]{--shirt-line:rgba(255,255,255,.7)}
.n.sh{position:relative;z-index:0;display:inline-flex;align-items:center;justify-content:center;min-width:1.5em;margin:.13em 0 .15em}
.n.sh .shirt{position:absolute;left:50%;top:50%;width:1.48em;height:1.26em;transform:translate(-50%,-50%);z-index:-1;overflow:visible}
.n.sh .so{fill:none;stroke:var(--shirt-line);stroke-width:1.3;stroke-linejoin:round}
.n.sh b{font:inherit;font-size:.74em;position:relative;top:.07em}
.kitrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0}
.kitlab{min-width:76px;font-size:13px;color:var(--muted)}
.kitb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 12px 6px;border:1px solid var(--line);border-radius:10px;background:var(--zone);font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;min-width:70px;cursor:pointer;color:inherit}
.kitb small{font-family:inherit;font-size:12px;font-weight:600;color:var(--muted)}
.kitb.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.sqn{font-family:var(--cond);font-weight:700;font-size:22px;line-height:1;margin:0 8px 0 0;vertical-align:middle}
.sqn .sqd{font-size:.74em;position:relative;top:.07em}
.kith{margin:10px 0 0;font-weight:700;font-size:14px}

/* àrbitres i taula (sense fotos: inicials) */
.refs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin:6px 0 0;font-size:13px;color:var(--muted)}
.refs b{color:var(--ink);font-weight:700}
.ref{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.refi{display:inline-flex;align-items:center;justify-content:center;flex:none;width:24px;height:24px;border-radius:50%;background:var(--zone);border:1px solid var(--line);font-family:var(--cond);font-weight:700;font-size:11px;color:var(--muted)}
.repcard.rs-score .refs{justify-content:center}
@media print{.refs{font-size:9pt}.refi{width:16px;height:16px;font-size:7pt}}
</style>
